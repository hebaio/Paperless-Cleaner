{% extends 'base.html' %}

{% block content %}
<h2>Settings</h2>
<form method="POST">
    <div class="mb-3">
        <label for="api_url" class="form-label">Paperless API URL</label>
        <input type="text" class="form-control" id="api_url" name="api_url" value="{{ settings.api_url }}" placeholder="http://192.168.1.100:8000" required>
        <div class="form-text">The base URL of your Paperless-ngx instance.</div>
    </div>
    <div class="mb-3">
        <label for="api_token" class="form-label">API Token</label>
        <input type="password" class="form-control" id="api_token" name="api_token" value="{{ settings.api_token }}" required>
        <div class="form-text">Create a token in your Paperless admin area.</div>
    </div>

    <hr class="my-4">
    <h4>LLM Configuration (Optional)</h4>
    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="llm_enabled" name="llm_enabled" value="true" {% if settings.llm_enabled == 'true' %}checked{% endif %}>
        <label class="form-check-label" for="llm_enabled">
            Enable LLM Similarity Search
        </label>
    </div>
    <div class="mb-3">
        <label for="llm_api_base" class="form-label">API Base URL</label>
        <input type="text" class="form-control" id="llm_api_base" name="llm_api_base" value="{{ settings.llm_api_base }}" placeholder="https://api.openai.com/v1">
    </div>
    <div class="mb-3">
        <label for="llm_api_key" class="form-label">API Key</label>
        <input type="password" class="form-control" id="llm_api_key" name="llm_api_key" value="{{ settings.llm_api_key }}">
    </div>
    <div class="mb-3">
        <label for="llm_model" class="form-label">Model Name</label>
        <input type="text" class="form-control" id="llm_model" name="llm_model" value="{{ settings.llm_model }}" placeholder="gpt-3.5-turbo">
    </div>

    <button type="submit" class="btn btn-primary">Save Settings</button>
</form>
{% endblock %}
